openapi: 3.0.1
info:
  title: API V1
  version: v1
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AccountEntry:
      type: object
      properties:
        id:
          type: integer
          example: 1324082
        capital_commitment_id:
          type: integer
          nullable: true
        entity_id:
          type: integer
          example: 17
        fund_id:
          type: integer
          example: 34
        investor_id:
          type: integer
          nullable: true
        folio_id:
          type: string
          nullable: true
          example: "TP3"
        reporting_date:
          type: string
          format: date
          example: "2025-03-31"
        entry_type:
          type: string
          example: "Reporting"
        name:
          type: string
          example: "YTD Change in Distribution"
        notes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          example: "2025-04-27T10:33:01.675+05:30"
        updated_at:
          type: string
          format: date-time
          example: "2025-04-27T10:33:01.675+05:30"
        cumulative:
          type: boolean
          example: true
        period:
          type: string
          example: "Q1-2025"
        parent_type:
          type: string
          nullable: true
        parent_id:
          type: integer
          nullable: true
        parent_name:
          type: string
          nullable: true
        commitment_name:
          type: string
          nullable: true
        generated:
          type: boolean
          example: true
        exchange_rate_id:
          type: integer
          nullable: true
        fund_formula_id:
          type: integer
          nullable: true
        rule_for:
          type: string
          example: "reporting"
        import_upload_id:
          type: integer
          nullable: true
        allocation_run_id:
          type: integer
          example: 924
        ref_id:
          type: string
          nullable: true
          example: null
        # Computed monetary fields (in fund currency)
        amount:
          type: number
          format: float
          example: 9000.0
        folio_amount:
          type: number
          format: float
          example: 9000.0
        tracking_amount:
          type: number
          format: float
          example: 0.0
        # Fund details
        fund_name:
          type: string
          example: "Tax Provision Fund"
        fund_currency:
          type: string
          example: "INR"
        # Folio / commitment details
        folio_currency:
          type: string
          nullable: true
          example: "USD"
        unit_type:
          type: string
          nullable: true
          example: "B"
        investor_name:
          type: string
          nullable: true
          example: "TPF3"
        custom_fields:
          type: object
          additionalProperties: true
          example: {}
      required:
        - id
        - entity_id
        - fund_id
        - reporting_date
        - entry_type
        - name
        - created_at
        - updated_at
        - cumulative
        - period
        - generated
        - rule_for
        - amount
        - folio_amount
        - fund_name
        - fund_currency
