# Permanent (301) redirects for URLs from the retired GoDaddy/WordPress site.
#
#   old path on caphive.com: new page on caphive.com
#
# Read by BOTH servers of the site — nginx in production
# (config/deploy/templates/nginx_conf.erb) and lib/middleware/website.rb in
# dev/test — through lib/middleware/website_redirects.rb, so one edit here covers both.
# Production only picks a change up after `cap <stage> nginx:update`
# (website:deploy does NOT re-render the nginx config).
#
# Matching is exact, case-insensitive, and ignores a trailing slash: the line
# for /about-us also catches /about-us/ and /About-Us. The query string is
# carried over to the new URL. Both sides must start with /.
#
# Where the list came from: the Wayback Machine CDX index for caphive.com,
# pulled on 2026-10-30 — every HTML page the WordPress-era site published.
# /blog/ and /case-study/ were NOT in the archive; they are convenience
# aliases for the obvious index pages, kept because people type them.
# To add more, check Search Console -> Pages -> "Not found (404)" or
# web.archive.org/web/*/caphive.com/* and add one line per old URL.
# `rake website:build` aborts if a target page does not exist.

# Company and legal
/about-us/: /about.html
/contact-us/: /contact.html
/privacy-policy/: /privacy.html
/terms-of-service/: /terms.html

