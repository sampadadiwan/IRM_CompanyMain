<!-- ================= COOKIE CONSENT ================= -->
<!-- Small bottom-left card, not a full-width bar and not a modal: it never
     covers the page content or blocks reading. Ships hidden and is revealed by
     the script below only when no choice is stored yet, so returning visitors
     never see it again.

     The script is inline rather than in assets/js/caphive.js on purpose — the
     homepage runs _partials/index_scripts.html and does not load caphive.js, so
     anything living there would be dead on the busiest page of the site. -->
<div class="consent" id="consent" role="region" aria-label="Cookie consent" hidden>
  <p class="consent-text">
    We use analytics cookies to see which pages are useful. Nothing is set until you accept.
    <a href="cookies.html">Cookie Policy</a>
  </p>
  <div class="consent-actions">
    <button type="button" class="btn btn-sm btn-outline" data-consent="denied">Decline</button>
    <button type="button" class="btn btn-sm btn-dark" data-consent="granted">Accept</button>
  </div>
</div>
<script>
(function(){
  var KEY = 'caphive.consent.v1';   /* version in the key: bump to re-ask after a policy change */
  var el = document.getElementById('consent');
  if(!el) return;

  function read(){ try { return localStorage.getItem(KEY); } catch(e){ return null; } }
  function write(v){ try { localStorage.setItem(KEY, v); } catch(e){} }

  var hideTimer;
  function show(){
    /* cancel a pending hide, or reopening within the fade-out would be undone
       by that timer firing afterwards */
    clearTimeout(hideTimer);
    el.hidden = false;
    requestAnimationFrame(function(){ el.classList.add('in'); });
  }
  function hide(){
    el.classList.remove('in');
    /* keep it in the DOM until the transition finishes, then take it out of the
       tab order entirely */
    hideTimer = setTimeout(function(){ el.hidden = true; }, 300);
  }

  function choose(value){
    write(value);
    /* gtag is defined in the head partial, which runs before this script. The
       guard covers the case where an ad blocker stripped it. */
    if(typeof gtag === 'function'){
      gtag('consent', 'update', { analytics_storage: value === 'granted' ? 'granted' : 'denied' });
    }
    hide();
  }

  el.querySelectorAll('[data-consent]').forEach(function(b){
    b.addEventListener('click', function(){ choose(b.dataset.consent); });
  });

  /* "Cookie settings" in the footer reopens the banner so a choice can be
     changed or withdrawn later — required, and the only way back once the
     banner has been dismissed. */
  document.querySelectorAll('[data-consent-open]').forEach(function(a){
    a.addEventListener('click', function(e){ e.preventDefault(); show(); });
  });

  if(!read()) show();
})();
</script>
