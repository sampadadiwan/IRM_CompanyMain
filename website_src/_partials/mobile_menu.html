<script>
(function(){
  /* Inline rather than in assets/js/caphive.js because the homepage renders
     _partials/index_scripts.html and never loads caphive.js — anything put
     there would leave the accordion dead on the homepage.

     The sub-links are ordinary <a>s, so the existing "close the menu on any
     link click" handler in both script bundles already covers them. The
     chevron is a <button>, so it deliberately does not match that selector
     and expanding never closes the menu. */
  document.querySelectorAll('#mobileMenu .mm-toggle').forEach(function(btn){
    var panel = document.getElementById(btn.getAttribute('aria-controls'));
    if(!panel) return;
    btn.addEventListener('click', function(){
      var open = panel.hidden;
      panel.hidden = !open;
      btn.setAttribute('aria-expanded', open);
    });
  });
})();
</script>
