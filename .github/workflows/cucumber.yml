# On-demand Cucumber test runner on GitHub Actions.
# Trigger from the Actions tab or CLI:
#   gh workflow run cucumber.yml --ref your-branch
#   gh workflow run cucumber.yml --ref main -f tags="@notification"
#   gh workflow run cucumber.yml --ref main -f features="features/core/document.feature"
name: Cucumber Tests

on:
  workflow_dispatch:
    inputs:
      tags:
        description: 'Cucumber tags (e.g. @notification, @javascript)'
        required: false
        default: ''
      features:
        description: 'Feature path (e.g. features/core/document.feature)'
        required: false
        default: ''
      skip_ai:
        description: 'Skip AI features (features/ai/)'
        required: false
        type: boolean
        default: true
      workers:
        description: 'Number of parallel workers (max 4)'
        required: false
        default: '3'

jobs:
  cucumber:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      RAILS_TEST_KEY: ${{ secrets.RAILS_TEST_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.4'
          bundler-cache: true

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Write test credentials key
        run: |
          echo "$RAILS_TEST_KEY" > config/credentials/test.key

      - name: Prepare test databases
        run: |
          WORKERS=${{ inputs.workers }}
          for i in $(seq 1 "$WORKERS") ""; do
            echo "Reloading test DB (worker: '${i:-default}')..."
            TEST_ENV_NUMBER=$i RAILS_ENV=test bundle exec rails runner "
              ActiveRecord::Base.connection.execute('PRAGMA foreign_keys = OFF')
              load 'db/schema_test.rb'
              ActiveRecord::Base.connection.execute('PRAGMA foreign_keys = ON')

              file_versions = Dir.glob('db/migrate/*.rb').map { |f| File.basename(f).split('_').first }
              db_versions = ActiveRecord::Base.connection.select_values('SELECT version FROM schema_migrations')
              stale = db_versions - file_versions
              if stale.any?
                stale.each { |v| ActiveRecord::Base.connection.execute(\"DELETE FROM schema_migrations WHERE version = '#{v}'\") }
                puts \"  Removed #{stale.size} stale migration entries\"
              end
            "
          done

      - name: Create results directories and runtime log
        run: |
          mkdir -p tmp/capybara
          mkdir -p tmp/cucumber_results
          mkdir -p /tmp/cucumber_progress
          touch tmp/parallel_runtime_cucumber.log

      - name: Run Cucumber
        run: |
          WORKERS=${{ inputs.workers }}
          TAGS="${{ inputs.tags }}"
          FEATURES="${{ inputs.features }}"

          # Build cucumber options: per-worker HTML report + per-worker failure rerun file
          # --require features MUST come first so step definitions and support files load
          CUKE_OPTS="-p parallel_rerun"
          CUKE_OPTS="$CUKE_OPTS --require features --require cucumber_dashboard"
          CUKE_OPTS="$CUKE_OPTS --format json --out tmp/cucumber_results/report_\$TEST_ENV_NUMBER.json"
          CUKE_OPTS="$CUKE_OPTS --format rerun --out tmp/cucumber_results/rerun_\$TEST_ENV_NUMBER.txt"

          if [ -n "$TAGS" ]; then
            CUKE_OPTS="$CUKE_OPTS --tags '$TAGS'"
          fi

          if [ -z "$FEATURES" ]; then
            # When running all features, build the list excluding AI if requested
            if [ "${{ inputs.skip_ai }}" = "true" ]; then
              FEATURES=$(find features -maxdepth 1 -mindepth 1 -type d -not -name 'ai' -not -name 'step_definitions' -not -name 'support' | sort | tr '\n' ' ')
              echo "Skipping AI features. Running: $FEATURES"
            else
              FEATURES="features"
              # Switch to the profile that includes `features` argument
              CUKE_OPTS=$(echo "$CUKE_OPTS" | sed 's/-p parallel_rerun/-p parallel/')
            fi
          fi

          # Start a background progress monitor that reads JSONL events
          (
            sleep 5
            while true; do
              sleep 10
              # Read all worker JSONL files and print a live status line
              python3 -c "
import json, glob, sys
workers = {}
for f in sorted(glob.glob('/tmp/cucumber_progress/worker_*.jsonl')):
    wid = f.split('worker_')[1].split('.')[0]
    counts = {'passed':0,'failed':0,'skipped':0}
    current = ''
    for line in open(f):
        try:
            d = json.loads(line)
            if d['type'] == 'scenario_end':
                counts[d.get('status','skipped')] += 1
            elif d['type'] == 'scenario_start':
                current = d.get('scenario','')[:50]
            elif d['type'] == 'feature_start':
                current = d.get('feature_name','')[:50]
        except: pass
    total = sum(counts.values())
    workers[wid] = f'W{wid}: {counts[\"passed\"]}✓ {counts[\"failed\"]}✗ ({total} done) [{current}]'
if workers:
    print('  '.join(workers[k] for k in sorted(workers)))
" 2>/dev/null
            done
          ) &
          MONITOR_PID=$!

          PCUC_QUIET=1 RUBYOPT="-W0" bundle exec parallel_cucumber \
            -n "$WORKERS" --first-is-1 \
            --group-by runtime --allowed-missing 100 \
            -o "$CUKE_OPTS" \
            $FEATURES

          EXIT_CODE=$?
          kill $MONITOR_PID 2>/dev/null || true
          exit $EXIT_CODE

      - name: Combine failure summaries
        if: always()
        run: |
          SUMMARY=tmp/cucumber_results/summary.txt
          echo "=== Cucumber Run Summary ===" > $SUMMARY
          echo "Branch: ${{ github.ref_name }}" >> $SUMMARY
          echo "Tags: ${{ inputs.tags || 'none' }}" >> $SUMMARY
          echo "Features: ${{ inputs.features || 'all' }}" >> $SUMMARY
          echo "Skip AI: ${{ inputs.skip_ai }}" >> $SUMMARY
          echo "Workers: ${{ inputs.workers }}" >> $SUMMARY
          echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $SUMMARY
          echo "" >> $SUMMARY

          # Per-worker breakdown from JSONL progress logs
          echo "=== Per-Worker Breakdown ===" >> $SUMMARY
          for f in /tmp/cucumber_progress/worker_*.jsonl; do
            if [ -f "$f" ]; then
              WORKER=$(basename "$f" .jsonl | sed 's/worker_//')
              echo "" >> $SUMMARY
              echo "--- Worker $WORKER ---" >> $SUMMARY

              # Extract worker_end event for counts
              END_EVENT=$(grep '"worker_end"' "$f" 2>/dev/null | tail -1)
              if [ -n "$END_EVENT" ]; then
                TOTAL=$(echo "$END_EVENT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('total_scenarios',0))" 2>/dev/null || echo "?")
                PASSED=$(echo "$END_EVENT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['counts'].get('passed',0))" 2>/dev/null || echo "?")
                FAILED=$(echo "$END_EVENT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['counts'].get('failed',0))" 2>/dev/null || echo "?")
                SKIPPED=$(echo "$END_EVENT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['counts'].get('skipped',0))" 2>/dev/null || echo "?")
                FEATURES_RUN=$(echo "$END_EVENT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('features_run',0))" 2>/dev/null || echo "?")
                echo "  Features: $FEATURES_RUN | Scenarios: $TOTAL | Passed: $PASSED | Failed: $FAILED | Skipped: $SKIPPED" >> $SUMMARY
              else
                echo "  (no completion event — worker may have crashed or timed out)" >> $SUMMARY
              fi

              # List features this worker ran
              FEATURE_LIST=$(grep '"feature_start"' "$f" 2>/dev/null | python3 -c "
import sys, json
for line in sys.stdin:
    try:
        d = json.loads(line)
        print('    ' + d.get('feature','') + ' (' + d.get('feature_name','') + ')')
    except: pass
" 2>/dev/null)
              if [ -n "$FEATURE_LIST" ]; then
                echo "  Features run:" >> $SUMMARY
                echo "$FEATURE_LIST" >> $SUMMARY
              fi

              # List failed scenarios with errors
              FAILURES=$(grep '"scenario_end"' "$f" 2>/dev/null | python3 -c "
import sys, json
for line in sys.stdin:
    try:
        d = json.loads(line)
        if d.get('status') == 'failed':
            loc = d.get('feature','') + ':' + str(d.get('line',''))
            name = d.get('scenario','')
            err = d.get('error','')
            print('    FAIL ' + loc + ' # ' + name)
            if err:
                print('         ' + err[:200])
    except: pass
" 2>/dev/null)
              if [ -n "$FAILURES" ]; then
                echo "  Failed scenarios:" >> $SUMMARY
                echo "$FAILURES" >> $SUMMARY
              fi
            fi
          done

          echo "" >> $SUMMARY

          # Combined rerun file (all workers merged, for easy copy-paste)
          cat tmp/cucumber_results/rerun_*.txt 2>/dev/null | sort -u > tmp/cucumber_results/all_failures_rerun.txt || true

          if [ -s tmp/cucumber_results/all_failures_rerun.txt ]; then
            echo "=== Rerun Command (copy-paste) ===" >> $SUMMARY
            echo "bundle exec cucumber $(cat tmp/cucumber_results/all_failures_rerun.txt | tr '\n' ' ')" >> $SUMMARY
          fi

          # Print summary to the Actions log
          echo ""
          echo "========================================"
          cat $SUMMARY
          echo "========================================"

      - name: Upload per-worker failure files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-failures
          path: /tmp/cucumber_progress/worker_*_failures.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload per-worker JSONL progress logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-progress-logs
          path: /tmp/cucumber_progress/worker_*.jsonl
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload JSON reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-json-reports
          path: tmp/cucumber_results/report_*.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload combined summary + rerun files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-summary
          path: |
            tmp/cucumber_results/summary.txt
            tmp/cucumber_results/all_failures_rerun.txt
            tmp/cucumber_results/rerun_*.txt
            tmp/cucumber_failures.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capybara-screenshots
          path: tmp/capybara/
          if-no-files-found: ignore
          retention-days: 30

