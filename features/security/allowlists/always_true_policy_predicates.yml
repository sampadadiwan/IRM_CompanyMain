# Pundit policy predicates whose entire body is the literal `true`.
# Checked by features/security/security_surface_drift_guard.feature (SG-4).
#
# Why: a predicate that is just `true` was the second most common root cause in the October 2026
# review — C3 (AI portfolio reports), H14, H15, H16, M18–M21, M25. Each let any signed-in user of
# any firm act on the record. `index?` is usually fine (the Scope filters rows); create?, update?,
# destroy? and custom actions almost never are.
#
# Format: "Entry": "Why this is acceptable". Every entry needs a reason. A new entry must say why
# the action is safe without the check (what authenticates or authorizes it instead) — "baseline"
# is reserved for the entries present when the guard was added on 2026-11-05.
# Remove an entry when the code no longer needs it: the guard also fails on stale entries, so this
# list can only shrink silently, never grow.
# Regenerate the current list (do NOT paste it over this file wholesale — review each new line):
#   TEST_ENV_NUMBER=$RANDOM RAILS_ENV=test bin/rails runner 'require "./features/security/support/security_surface"; puts SecuritySurface.always_true_policy_predicates'
