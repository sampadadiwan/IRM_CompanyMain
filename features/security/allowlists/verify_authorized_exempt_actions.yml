# Routed actions where Pundit's verify_authorized / verify_policy_scoped does NOT run.
# Checked by features/security/security_surface_drift_guard.feature (SG-1).
#
# Why: actions excluded from verify_authorized were the most common root cause in the October
# 2026 security review (H1, H6, H7, H8, M12, M15, L10 — docs/security/security_review_2026_10.md).
# An excluded action that forgets to call `authorize` runs for any signed-in user, in any firm.
#
# Format: "Entry": "Why this is acceptable". Every entry needs a reason. A new entry must say why
# the action is safe without the check (what authenticates or authorizes it instead) — "baseline"
# is reserved for the entries present when the guard was added on 2026-11-05.
# Remove an entry when the code no longer needs it: the guard also fails on stale entries, so this
# list can only shrink silently, never grow.
# Regenerate the current list (do NOT paste it over this file wholesale — review each new line):
#   TEST_ENV_NUMBER=$RANDOM RAILS_ENV=test bin/rails runner 'require "./features/security/support/security_surface"; puts SecuritySurface.unprotected_actions["authorize"]'
