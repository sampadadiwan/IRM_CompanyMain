# Routed actions that run WITHOUT the CSRF authenticity-token check.
# Checked by features/security/security_surface_drift_guard.feature (SG-3).
#
# Why: an action that uses the cookie session but skips the token can be triggered by another
# site. L10 (deal step reorder) was exactly that. Token / webhook endpoints are fine (no cookie);
# signed-in endpoints in this list depend on the session cookie staying SameSite=Lax.
#
# Format: "Entry": "Why this is acceptable". Every entry needs a reason. A new entry must say why
# the action is safe without the check (what authenticates or authorizes it instead) — "baseline"
# is reserved for the entries present when the guard was added on 2026-11-05.
# Remove an entry when the code no longer needs it: the guard also fails on stale entries, so this
# list can only shrink silently, never grow.
# Regenerate the current list (do NOT paste it over this file wholesale — review each new line):
#   TEST_ENV_NUMBER=$RANDOM RAILS_ENV=test bin/rails runner 'require "./features/security/support/security_surface"; puts SecuritySurface.unprotected_actions["csrf"]'
