# Routed actions that run WITHOUT authenticate_user! (or Admin's authenticate_admin).
# Checked by features/security/security_surface_drift_guard.feature (SG-2).
#
# Why: these are the app's internet-facing surface. H2 (SendGrid inbound) and M1 (WhatsApp,
# DocuSign, Digio webhooks) were unauthenticated endpoints writing into any tenant. A new action
# that skips sign-in must be a deliberate, reviewed decision, not a side effect of a broad
# `skip_before_action` (see the H31 note in InvestorKycsController).
# "(conditional)" = sign-in is skipped only when a runtime condition holds (e.g. a signed_id).
#
# Format: "Entry": "Why this is acceptable". Every entry needs a reason. A new entry must say why
# the action is safe without the check (what authenticates or authorizes it instead) — "baseline"
# is reserved for the entries present when the guard was added on 2026-11-05.
# Remove an entry when the code no longer needs it: the guard also fails on stale entries, so this
# list can only shrink silently, never grow.
# Regenerate the current list (do NOT paste it over this file wholesale — review each new line):
#   TEST_ENV_NUMBER=$RANDOM RAILS_ENV=test bin/rails runner 'require "./features/security/support/security_surface"; puts SecuritySurface.unprotected_actions["authenticate"]'
