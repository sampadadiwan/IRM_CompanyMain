global:
  scrape_interval: 15s       # How frequently to scrape targets
  evaluation_interval: 15s   # How frequently to evaluate alerting rules

rule_files:
  - "alerts.yml"

scrape_configs:
  # this is the port for the prometheus exporter
  - job_name: 'rails_app'
    static_configs:
      - targets: ['host.docker.internal:9394'] 
  - job_name: node
    static_configs:
      - targets: ['host.docker.internal:9100']

