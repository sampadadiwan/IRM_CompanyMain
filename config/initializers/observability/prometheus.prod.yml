global:
  scrape_interval: 15s       # How frequently to scrape targets
  evaluation_interval: 15s   # How frequently to evaluate alerting rules

rule_files:
  - "alerts.yml"

scrape_configs:
  # this is the port for the prometheus exporter
  - job_name: 'rails_app'
    static_configs:
      # These IPs will need to change based on the deployment - for now manually
      - targets: ['10.0.1.56:9394', '10.0.2.137:9394']
  # node_exporter (port 9100) — app servers + DB servers (node_exporter installed by setup.sh)
  # Replica IP: bundle exec rails runner "puts Rails.application.credentials[:DB_HOST_REPLICA]"
  - job_name: node
    static_configs:
      - targets:
          - '10.0.1.56:9100'       # primary app server
          - '10.0.2.137:9100'      # second app server
          - '10.0.3.182:9100'      # primary DB server
          - '10.0.4.78:9100'   # replica DB server — replace with credentials[:DB_HOST_REPLICA]

  # mysqld_exporter (port 9104) — installed on each DB server via mysqld_exporter/setup.sh
  # Replica IP: bundle exec rails runner "puts Rails.application.credentials[:DB_HOST_REPLICA]"
  - job_name: mysqld
    static_configs:
      - targets:
          - '10.0.3.182:9104'     # primary DB server
          - '10.0.4.78:9104'  # replica DB  — replace with credentials[:DB_HOST_REPLICA]