  compliance:
    glossary:
      pack: "A named set of rules from one source — a regulator (SEBI, IFSCA) or your own fund agreement."
      locked_pack: "A CapHive regulator pack: you use it but cannot edit it. For one fund you may only make a limit stricter."
      version: "A frozen copy of a pack's rules with the date it takes effect. Old results keep the version they were checked against."
      applicability: "Which funds a new version applies to: all funds, new funds only, or all funds after a transition period."
      classification: "Which part of a pack applies to a fund — e.g. Category II gets the 25% limit, Category III the 10% one."
      input: "Something a pack needs that CapHive cannot work out by itself — e.g. which investors are the sponsor. You map it once for the whole firm."
      check: "One rule CapHive tests from your data every night: a figure against a limit, a required signed document, or what a document says."
      run: "One nightly pass over every check of a fund, at 02:00 in your firm's time zone. Run now does the same on demand."
      result: "What one check found in one run, with every step of how we checked. Results are never edited — a later run writes a new one."
      register_item: "One breach episode: opened by the first failing run, kept while the check keeps failing, closed by the first passing run."
      maker_checker: "A change that weakens monitoring needs two people: one asks (maker), a different approver decides (checker)."
      duty: "Something a person must do and prove, that data cannot show — e.g. the quarterly SEBI report filed."
      fact: "A value read from a document (by AI or by hand). It counts only after a person confirms it against the quote."
      draft: "A version (or an AI-drafted check) still being edited. Test it on a fund, then publish."
      preview: "Running a draft or future version on a real fund. Nothing is saved and the register is not touched."
      open: "The check is failing and nobody has picked it up yet."
      in_progress: "Assigned to someone who is working on it."
      pending_approval: "An explanation was sent; a different approver must accept or reject it."
      explained: "An approver accepted this breach with a reason. It reopens if the figure gets worse."
      closed: "The episode ended — usually a passing run (Cleared by data), or the check was removed, disabled or detached."
      breach: "The figure is outside the limit. A register item opens with a fix-by date."
      pass: "Within the limit on the run date."
      needs_review: "Rules cannot decide it — a person must look (e.g. facts waiting to be confirmed). Never counted as a pass."
      could_not_check: "Something the check needs is missing — an input, a rate, a date. Add it and the next run checks again. Never a pass."
      warning: "Fails a new version during its transition period — shown, but no register item opens until the transition ends."
      fix_by: "The opened date plus the check's time to fix. Past it, the owner and approvers are told once."
      overdue: "Still open after its fix-by date."
      how_we_checked: "How the run reached this result, step by step, from your records as they stood at that run. Nothing here is typed in by hand."
      about_this_check: "What the check tests, why it matters, and what usually causes a failure — written for someone new to compliance."
      getting_started: "The setup steps, ticked off from your own data. A step reopens if your setup changes."
      whats_next: "What you can do now about the record on this page, given your role."
      monitoring: "When on, every attached fund is checked every night at 02:00. Off, nothing runs on schedule (Run now still works)."
    intros:
      home: "Every fund is checked every night against the rule packs attached to it. Start with Getting started, then come back each morning for what changed."
      register: "One row per breach episode. Assign each one, fix the data, or ask an approver to accept it with a reason."
      register_item: "One breach episode, from the first failing run until a run passes. Below: what the check tests, how we checked, and what to do."
      duties: "Things a person must do and prove that data cannot show. Upload the evidence, then Mark done."
      facts: "Values read from your documents. Check each against its quote and page, correct it if needed, then Confirm — only confirmed facts count."
      fund_packs: "Which rule packs each fund carries. A fund with none is Not monitored — never shown as compliant."
      fund_pack: "The latest result of every check of this pack on this fund. Open a check to see how we checked it."
      result: "What one check found in one run. Read About this check first, then How we checked, step by step."
      packs: "The rule library: CapHive's regulator packs (locked) and your own packs. Open a pack to see its versions."
      pack: "Each version is a frozen copy of the rules with the date it takes effect. Funds move to a new version by its rules."
      version: "The checks and duties of this version. Drafts can be tested on a fund and then published."
      setup: "How your firm's data maps to the packs, who owns compliance, and whether monitoring is on."
      draft: "A check the AI drafted from your sentence. Read it in plain words, correct any part, test it on a fund, then save."
      onboarding: "Which firms with Compliance switched on are still setting up, and the step they are on. Counts only — no customer data."
