# unit name and the entity's own overrides first). Closed-ended screens never read these keys.
# %{unit} %{units} %{Unit} %{Units} are filled with the resolved unit name ("unit" unless overridden).
# Worked examples C7, E212–E214 — openspec/changes/open-ended-funds/design.md#worked-examples
