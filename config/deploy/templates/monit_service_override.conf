# systemd drop-in for monit.service. Installed to
# /etc/systemd/system/monit.service.d/override.conf by `cap <stage> IRM:setup`
# (or standalone via `cap <stage> IRM:fix_monit_sandbox`).
#
# WHY THIS EXISTS
# ---------------
# Ubuntu's monit package (1:5.33.0-2build2) ships a heavily sandboxed unit —
# NoNewPrivileges, ProtectHome=yes, ProtectSystem=strict, PrivateTmp, and a
# CapabilityBoundingSet of just CAP_DAC_READ_SEARCH/CAP_NET_RAW/CAP_SYS_PTRACE.
# That is a sensible default for a monitor that only reads state, but monit's
# whole job here is to LAUNCH privileged start/stop programs on our behalf —
# `/bin/su - ubuntu -c '... bundle exec sidekiq ...'` for sidekiq and
# `sudo -iu ubuntu ...` for puma — and the sandbox makes that impossible:
#
#   'sidekiq_IRM_staging' failed to start (exit status 1) -- '/bin/su - ubuntu -c ...':
#       su: cannot set groups: Operation not permitted
#   'puma_IRM_staging' failed to start (exit status 1) -- '/usr/bin/sudo -iu ubuntu ...':
#       sudo: PERM_SUDOERS: setresuid(-1, 1, -1): Operation not permitted
#
# The failure is invisible from the deploy's side: `cap <stage> sidekiq:restart`
# runs `monit restart <svc>`, which only QUEUES the action and returns 0, so
# Capistrano reports success while monit retries and fails every 60s forever.
# `monit summary` is where it actually shows up ("Execution failed | Does not exist").
#
# A drop-in (rather than editing /usr/lib/systemd/system/monit.service) means an
# apt upgrade that rewrites the vendor unit cannot silently take the sandbox
# back — systemd merges this over whatever the package ships.

[Service]
# The observed blocker. `su` has to setgroups()/setgid()/setuid() to drop from
# root to ubuntu, which needs CAP_SETGID/CAP_SETUID. An EMPTY assignment would
# mean "no capabilities at all"; `~` means "all but the listed ones", and with
# nothing listed that is the full set — i.e. the pre-hardening behaviour.
CapabilityBoundingSet=~

# Setuid/setgid binaries (su, sudo) cannot escalate under NoNewPrivileges, and
# the flag is inherited by every child, so it would also break anything the app
# itself shells out to with sudo.
NoNewPrivileges=no
RestrictSUIDSGID=no

# ProtectHome=yes mounts an EMPTY tmpfs over /home inside monit's mount
# namespace, and children inherit it — so /home/ubuntu/IRM/current, rvm and the
# whole app are simply not there for anything monit starts.
ProtectHome=no

# ProtectSystem=strict makes the entire filesystem read-only except ReadWritePaths,
# which would leave sidekiq unable to write logs, pids or tmp files. Clearing
# ReadWritePaths too (an empty assignment resets the list) means systemd sets up
# no filesystem namespace at all and children see the real disk.
ProtectSystem=off
ReadWritePaths=

# PrivateTmp gives monit's children a /tmp of their own. That one is easy to
# miss and specific to this app: the xirr_py container is run with `-v /tmp:/tmp`
# and jobs hand files to it through /tmp, so a private /tmp breaks the handoff
# with a confusing "file not found" rather than a permissions error.
PrivateTmp=no

# YJIT (and any JIT) needs pages that are both writable and executable; puma is
# started with --yjit from its monit config.
MemoryDenyWriteExecute=no

# The remaining hardening options do not block the app today, but they are all
# inherited by every process monit starts, and a half-sandbox is a trap that
# resurfaces later as some unrelated-looking failure. monit is a supervisor for
# privileged programs; treat it as one.
LockPersonality=no
ProtectClock=no
ProtectControlGroups=no
ProtectHostname=no
ProtectKernelLogs=no
ProtectKernelModules=no
ProtectKernelTunables=no
RestrictRealtime=no
SystemCallArchitectures=
